
name: Deployment Notification

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify on Success
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          echo "Deployment successful!"
          echo "Site live at: https://${REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/"

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H "Content-type: application/json" \
              --data '{"text":"Profile site deployed successfully!"}' \
              "$SLACK_WEBHOOK_URL"
          else
            echo "Slack webhook not configured. Skipping Slack notification."
          fi

      - name: Notify on Failure
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        run: |
          echo "Deployment FAILED! Check the Actions tab."
