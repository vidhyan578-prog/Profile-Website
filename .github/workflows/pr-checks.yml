
name: PR Quality Checks

on:
  pull_request:
    branches: [main]

jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all HTML files have title tags
        run: |
          for file in *.html; do
            if ! grep -q "<title>" "$file"; then
              echo "ERROR: $file is missing <title> tag"
              exit 1
            fi
          done
          echo "All HTML files have title tags"
      
  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check images have alt attributes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          missing = []

          for file in Path(".").glob("*.html"):
              content = file.read_text(encoding="utf-8")

              for match in re.finditer(r"<img\b[^>]*>", content, re.I | re.S):
                  tag = match.group(0)

                  if not re.search(r"\balt\s*=", tag, re.I):
                      line = content.count("\n", 0, match.start()) + 1
                      missing.append(f"{file}:{line}")

          if missing:
              print("Images missing alt attributes:")
              print("\n".join(missing))
              raise SystemExit(1)

          print("All images have alt attributes")
          PY


  check-no-console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for console.log in JS
        run: |
          if grep -rn "console.log" js/*.js; then
            echo "WARNING: Remove console.log before merging"
            exit 1
          fi
          echo "No console.log found"
  all-checks-passed:
    runs-on: ubuntu-latest
    needs:
      - check-html-titles
      - check-image-alt
      - check-no-console-log
    steps:
      - name: All checks passed
        run: echo "All PR checks passed! Ready for review."
        
